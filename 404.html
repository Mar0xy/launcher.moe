<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Launcher.moe</title>
    <link rel="icon" href="capy.png" type="image/png">
    <style>
        :root {
            --bg: #09090f;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --accent-2: #c026d3;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(139,92,246,0.18);
            --surface: rgba(255,255,255,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 32px; overflow: hidden;
        }
        .bg-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .bg-glow::before {
            content: "";
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle,rgba(124,58,237,0.15) 0%,transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%,-50%);
        }
        .content { position: relative; z-index: 1; max-width: 480px; }
        .logo {
            width: 72px; height: 72px; object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(124,58,237,0.5));
            margin: 0 auto 24px; display: block;
            animation: float 7s ease-in-out infinite;
        }
        @keyframes float {
            0%,100%{transform:translateY(0) scaleX(-1)}
            50%{transform:translateY(-10px) scaleX(-1)}
        }
        .code {
            font-size: 5em; font-weight: 800; line-height: 1;
            letter-spacing: -0.04em; margin-bottom: 12px;
            background: linear-gradient(135deg, #f1f5f9 20%, #a78bfa 60%, #c084fc 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        h1 { font-size: 1.3em; font-weight: 700; margin-bottom: 10px; }
        p { color: var(--text-muted); font-size: 0.95em; line-height: 1.7; margin-bottom: 30px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 24px; border-radius: 10px;
            font-weight: 600; font-size: 0.9em;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg,var(--accent),var(--accent-2));
            color: white; box-shadow: 0 4px 20px rgba(124,58,237,0.35);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,58,237,0.5); }
        .btn-secondary {
            background: var(--surface); color: var(--text); border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.07); transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="content">
    <img src="capy.png" alt="Launcher.moe" class="logo">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have been moved.</p>
    <div class="actions">
        <a href="/" class="btn btn-primary">Back to Home</a>
    </div>
</div>
</body>
</html>
